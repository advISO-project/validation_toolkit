name: Run PyTest on Push

on:
  push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8 importlib-resources pyyaml

    - name: Run linting
      shell: bash -l {0}
      run: |
        # stop the build if there are Python syntax errors or undefined names
        # exit-zero treats all errors as warnings.
        flake8 . --count --select=E9,F63,F7 --show-source --statistics --exit-zero
        # Check function comlexity and line length. The GitHub editor is 127 chars wide
        # exit-zero treats all errors as warnings.
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics --exit-zero

    - name: Run pytest
      run: pytest -v