[build-system]
requires = [
    "setuptools>=69",
    "setuptools-scm>=8",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "adviso-compare"
dynamic = ["version"]
description = "Translate, compare, and report differences between structured bioinformatics datasets."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bruhad Dave", email = "bd8@sanger.ac.uk" },
]
keywords = [
    "bioinformatics",
    "data validation",
    "ISO 15189",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "jsonschema[format-nongpl]>=4.23,<5",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<9",
    "setuptools>=69",
    "setuptools-scm>=8",
    "wheel",
]

[project.scripts]
adviso-compare = "adviso_compare.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["adviso_compare*"]
namespaces = false

[tool.setuptools.package-data]
"adviso_compare.schemas" = ["*.json"]

[tool.setuptools.data-files]
"share/doc/adviso-compare" = ["docs/user-guide.md"]
"share/doc/adviso-compare/examples/automatic" = [
    "docs/examples/automatic/query.csv",
    "docs/examples/automatic/reference.csv",
]
"share/doc/adviso-compare/examples/custom" = [
    "docs/examples/custom/configuration.yaml",
    "docs/examples/custom/query.csv",
    "docs/examples/custom/reference.json",
]

[tool.setuptools_scm]
root = "../.."
relative_to = "pyproject.toml"
version_file = "src/adviso_compare/_version.py"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"
